<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Week 3</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body {font-family:'Poppins'; background:#eef6fb; padding:20px;}
.card {background:white; padding:20px; border-radius:10px;}
button {margin-top:15px;}
</style>
</head>

<body>

<h1>🌲 Week 3: Stability & Change</h1>

<div class="card">

<h2>🦪 Zebra Mussels</h2>

<p>Zebra mussels are reducing native species.</p>

<input type="radio" name="q1" value="0"> Competition<br>
<input type="radio" name="q1" value="1"> Sunlight<br>

<button onclick="check()">Check</button>
<p id="f"></p>

</div>

<script>
function check(){
let q=document.querySelector('input[name="q1"]:checked');
let score = (q && q.value=="0") ? 1 : 0;
document.getElementById("f").innerHTML="Score: "+score+"/1";
}
</script>

</body>
</html>
